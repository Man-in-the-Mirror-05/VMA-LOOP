# v2.0 - 单轮tagger
# Milestone 2: 多模态 API 配置
# 所有 API 相关的可配置项都集中在这里：
# - 模型名称、base_url、max_tokens、timeout
# - 重试次数与退避策略
# - 视频帧提取参数
# 注意：API key 不在这里，必须走环境变量 BAILIAN_API_KEY。

provider: "bailian"
model: "qwen-vl-plus"
base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

# 调用参数
max_tokens: 2048
temperature: 0.2
timeout_sec: 60

# 重试与限流
retry:
  max_retries: 3
  backoff_base_sec: 2.0
  max_backoff_sec: 30.0

# 视频预处理
video_preprocessing:
  target_fps: 1
  max_frames: 8
  resize_max_side: 512
  image_quality: 85

# 成本控制：测试阶段建议切换 7b/3b
cost_control:
  test_model: "qwen2.5-vl-7b-instruct"
  demo_model: "qwen2.5-vl-72b-instruct"
